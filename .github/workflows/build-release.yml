name: Build Zodíaco Viewer release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows-installer:
    name: Build Windows NSIS installer
    runs-on: windows-latest

    steps:
      - name: Checkout release repository
        uses: actions/checkout@v4

      - name: Checkout application source
        uses: actions/checkout@v4
        with:
          repository: EditoraFX/ZodiacoLurk
          ref: main
          path: source
          token: ${{ secrets.ZODIACO_SOURCE_TOKEN }}

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Configure Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        working-directory: source
        run: npm ci

      - name: Verify signing configuration
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY não está configurada no repositório de releases."
          }

      - name: Build and publish Tauri installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: source
          tagName: v__VERSION__
          releaseName: Zodíaco Viewer v__VERSION__
          releaseBody: |
            Instalador oficial do Zodíaco Viewer para Windows 10/11 x64.

            O pacote foi compilado a partir da branch main do repositório principal.
          releaseDraft: false
          prerelease: false
